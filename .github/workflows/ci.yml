name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen        # exige uv.lock commité
      - run: uv run pytest -q
      - name: Smoke test de bout en bout (données SYNTHETIQUES, sans réseau ni MLflow)
        # Exécuté dans un dossier isolé pour ne pas toucher data/manifest.json (empreinte des vraies données UCI).
        run: |
          mkdir -p smoke
          cp config.json smoke/ && cp -r policies smoke/
          uv run python -c "from velos.synthetic import make_hour_frame; make_hour_frame(seed=1).to_csv('smoke/hour.csv', index=False)"
          uv run velos --config smoke/config.json fetch --from-file smoke/hour.csv
          uv run velos --config smoke/config.json replay-init
          uv run velos --config smoke/config.json run --no-tracking --no-release
          uv run velos --config smoke/config.json replay-next
          uv run velos --config smoke/config.json run --lot smoke/data/incoming/lot-2012-01.csv --no-tracking --no-release
          uv run velos --config smoke/config.json make-bad-lot --kind negatif
          code=0; uv run velos --config smoke/config.json run --lot smoke/data/incoming/lot-2012-02.csv --no-tracking --no-release || code=$?
          test "$code" = "2"   # le lot corrompu doit être rejeté avec le code 2

  docker:
    # Vérifie l'infrastructure sans la lancer : configuration Compose valide et image de l'API constructible.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configuration Compose valide (valeurs d'exemple, aucun secret)
        run: docker compose --env-file .env.example -f infra/compose.yml config --quiet
      - name: Image de l'API construite depuis uv.lock
        run: docker build -f infra/api.Dockerfile -t velos-api:ci .
