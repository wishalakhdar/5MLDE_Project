# Dashboards versionnés avec le code : chargés au démarrage de Grafana, non modifiables depuis l'interface
# (toute évolution passe par Git). Fichiers JSON dans ./json/.
apiVersion: 1
providers:
  - name: velos
    folder: Velos
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/json
