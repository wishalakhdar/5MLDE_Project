# Socle d'infrastructure. Lancer : docker compose --env-file .env -f infra/compose.yml up -d
# Versions d'images vérifiées à l'exécution (Docker Desktop, Windows 11, 18-19/11/2026) :
# postgres:17 suit les mises à jour mineures (limite connue, voir README). Tout changement de tag est à noter dans docs/TRANSFERT.md.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: velos
      API_WRITER_PASSWORD: ${API_WRITER_PASSWORD}
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD}
      PIPELINE_WRITER_PASSWORD: ${PIPELINE_WRITER_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d velos"]
      interval: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    command: >
      mlflow server --host 0.0.0.0 --port 7281
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --allowed-hosts localhost:*,127.0.0.1:*,mlflow:*
    volumes: [mlflowdata:/mlflow]
    ports: ["127.0.0.1:7281:7281"]
    healthcheck:   # « prêt » = l'API REST répond (l'API de prédiction attend cet état pour charger le modèle)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7281/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 30s

  prefect:
    image: prefecthq/prefect:3.8.7-python3.12
    command: prefect server start --host 0.0.0.0
    volumes: [prefectdata:/root/.prefect]
    ports: ["127.0.0.1:4200:4200"]

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:3000:3000"]

  # API de prédiction (phase 2). Ressources réglables pour les tests de charge, par exemple :
  #   $env:API_CPUS="2"; $env:API_WORKERS="2"; docker compose --env-file .env -f infra/compose.yml up -d api
  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    image: velos-api:local
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:7281
      VELOS_DB_HOST: postgres
      POSTGRES_PORT: "5432"
      API_WRITER_PASSWORD: ${API_WRITER_PASSWORD}
      API_WORKERS: ${API_WORKERS:-1}
      # Registre indisponible : abandonner en ~15 s (au lieu de plusieurs minutes) pour démarrer sans modèle
      # et répondre 503, plutôt que de rester injoignable pendant tout le démarrage.
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "2"
      MLFLOW_HTTP_REQUEST_BACKOFF_FACTOR: "1"
      MLFLOW_HTTP_REQUEST_TIMEOUT: "10"
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-1.0}"
          memory: ${API_MEMORY:-1g}
    depends_on:
      postgres: {condition: service_healthy}
      mlflow: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 40s
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]

volumes: {pgdata: {}, mlflowdata: {}, prefectdata: {}, grafanadata: {}}
