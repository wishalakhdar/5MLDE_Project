[project]
name = "velos-mlops"
version = "0.1.0"
description = "Projet final 5MLDE : chaîne MLOps sur UCI Bike Sharing (phase 1 : données, pipeline, MLflow, Prefect)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "requests>=2.32",
    "mlflow==3.16.1",
    "prefect==3.8.7",
    "fastapi>=0.163.1",
    "uvicorn[standard]>=0.54.0",
    "psycopg[binary,pool]>=3.3.9",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "locust>=2.47.0",
    "pytest>=8",
]

[project.scripts]
velos = "velos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
